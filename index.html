
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FriendSpace</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101323;
    color: white;
}
header {
    background: #202744;
    padding: 22px;
    text-align: center;
    font-size: 28px;
    color: #8b9cff;
    font-weight: bold;
}
main {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}
h1 { text-align: center; }
p { color: #b9c2df; text-align: center; }
input, button {
    padding: 13px;
    border: none;
    border-radius: 9px;
    margin: 7px;
}
input { width: 90%; max-width: 400px; }
button {
    background: #687cff;
    color: white;
    cursor: pointer;
}
.profile {
    background: #202744;
    padding: 22px;
    border-radius: 15px;
    margin: 15px auto;
    max-width: 420px;
    text-align: center;
}
.profile h2 { color: #9eacff; }
</style>
</head>
<body>

<header>FriendSpace</header>

<main>
<h1>Find New Friends 🌍</h1>
<p>Находи новых друзей и общайся!</p>

<center>
<input id="name" placeholder="Твоё имя">
<br>
<input id="hobby" placeholder="Твои увлечения">
<br>
<button onclick="addProfile()">Создать профиль</button>
</center>

<h2 style="text-align:center">Community</h2>
<div id="profiles"></div>
</main>

<script>
function addProfile() {
    let name = document.getElementById("name").value.trim();
    let hobby = document.getElementById("hobby").value.trim();

    if (!name || !hobby) {
        alert("Заполни все поля!");
        return;
    }

    let profile = document.createElement("div");
    profile.className = "profile";

    let title = document.createElement("h2");
    title.textContent = name;

    let description = document.createElement("p");
    description.textContent = "Увлечения: " + hobby;

    profile.append(title, description);
    document.getElementById("profiles").appendChild(profile);

    document.getElementById("name").value = "";
    document.getElementById("hobby").value = "";
}
</script>

</body>
</html>
